<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    
    <!-- BROWSER PERSISTENCE TAGS - Products will not reset -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <!-- Title tag -->
    <title>Bashir Flour Shop | Premium Quality Wheat & Flour</title>
    
    <!-- Version Control - Force update on deploy -->
    <script>
      const SITE_VERSION = '2.0.0'; // Update this with every deploy
      const STORAGE_KEY = 'basheer_flour_version';
      
      // Check if version changed
      if (localStorage.getItem(STORAGE_KEY) !== SITE_VERSION) {
        console.log('🔄 New version detected, clearing cache...');
        
        // Clear all caches
        if ('caches' in window) {
          caches.keys().then(names => {
            names.forEach(name => {
              caches.delete(name);
            });
          });
        }
        
        // Clear localStorage (except version)
        const savedProducts = localStorage.getItem('flour_shop_products');
        localStorage.clear();
        if (savedProducts) {
          localStorage.setItem('flour_shop_products', savedProducts);
        }
        
        // Set new version
        localStorage.setItem(STORAGE_KEY, SITE_VERSION);
        
        // Reload page once
        if (!sessionStorage.getItem('reloaded')) {
          sessionStorage.setItem('reloaded', 'true');
          window.location.reload(true);
        }
      }
    </script>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Premium quality wheat and flour from Bashir Flour Shop. Fresh from farms, traditional stone chakki processing. Order via WhatsApp/Call.">
    <meta name="keywords" content="flour, wheat, atta, chakki, bashir, lahore, pakistan, fresh, premium, quality">
    <meta name="author" content="Bashir Flour Shop">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Bashir Flour Shop | Premium Quality Wheat & Flour">
    <meta property="og:description" content="Fresh from farms, traditional stone chakki processing. Premium quality at best prices.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/shop-images/wheat.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker for Persistent Storage -->
    <script>
      // Register Service Worker for offline persistence
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
        
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('ServiceWorker registration successful');
          }, function(err) {
            console.log('ServiceWorker registration failed');
          });
        });
      }
      
      // Force localStorage persistence
      if ('storage' in navigator && 'persist' in navigator.storage) {
        navigator.storage.persist().then(function(persistent) {
          console.log('Storage persistence granted:', persistent);
        });
      }
    </script>
  </body>
</html>
